
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سابقة أعمالنا | PROFiT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b09;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    header h1 {
      color: #42c875;
      font-size: 32px;
    }

    header p {
      color: #ccc;
      line-height: 1.8;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(
        auto-fit, minmax(min(100%, 260px), 1fr)
      );
      gap: 22px;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .video-card {
      background: #151a17;
      border: 1px solid #29352d;
      padding: 12px;
      border-radius: 14px;
    }

    .video-card video {
      width: 100%;
      display: block;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      background: #000;
      border-radius: 9px;
    }

    .video-card h3 {
      color: #42c875;
      margin-bottom: 8px;
    }

    .video-card p {
      color: #ccc;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      color: #42c875;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>سابقة أعمال PROFiT</h1>
    <p>شاهد نماذج من أعمالنا في الدعاية والإعلان وصناعة المحتوى.</p>
    <a class="back" href="index.html">العودة للرئيسية</a>
  </header>

  <main class="videos">

    <article class="video-card">
      <video controls playsinline preload="metadata">
        <source src="videos/ad-01.mp4" type="video/mp4">
      </video>
      <h3>إعلان إبداعي</h3>
      <p>من أعمال PROFiT</p>
    </article>

    <article class="video-card">
      <video controls playsinline preload="metadata">
        <source src="videos/ad-02.mp4" type="video/mp4">
      </video>
      <h3>مونتاج فيديو</h3>
      <p>من أعمال PROFiT</p>
    </article>

  </main>
</body>
</html>
