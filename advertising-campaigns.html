
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="خدمات الحملات الإعلانية من PROFIT Advertising & Marketing.">
  <title>الحملات الإعلانية | PROFIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(5, 8, 10, .78), rgba(5, 8, 10, .92)),
        url("city-night.png") center / cover fixed no-repeat;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 25px 6%;
      text-align: center;
    }

    .logo {
      color: #fff;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #24D17E;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 45px 20px 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .label {
      color: #24D17E;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      direction: ltr;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 25px;
      text-align: center;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.5;
    }

    .service-card {
      width: 100%;
      max-width: 620px;
      padding: 30px;
      background: rgba(17, 24, 19, .88);
      border: 1px solid rgba(36, 209, 126, .4);
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(36, 209, 126, .08);
    }

    .service-card h2 {
      color: #24D17E;
      font-size: 19px;
      margin: 0 0 12px;
    }

    .service-card p {
      color: #D5DDD8;
      font-size: 16px;
      line-height: 2;
      margin: 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #24D17E;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      color: #24D17E;
      transition: .2s ease;
    }

    .btn.primary {
      background: #24D17E;
      color: #07130C;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #AEB5BD;
      border-top: 1px solid rgba(255, 255, 255, .12);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 15px;
      }

      .service-card {
        padding: 23px 20px;
      }

      .service-card p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">PRO<span>FIT</span></div>
    <div class="subtitle">ADVERTISING &amp; MARKETING</div>
  </header>

  <main>
    <div class="label">OUR SERVICES</div>

    <h1>الحملات الإعلانية</h1>

    <div class="service-card">
      <h2>عن الخدمة</h2>
      <p>
        نخطط وننفذ حملات إعلانية تستهدف جمهورك المناسب،
        وتساعدك على زيادة الوصول وجذب عملاء محتملين،
        من خلال أفكار إعلانية تتناسب مع أهداف مشروعك.
      </p>
    </div>

    <div class="actions">
      <a class="btn primary" href="index.html#contact">
        تواصل مع PROFIT
      </a>

      <a class="btn" href="index.html#services">
        العودة للخدمات
      </a>
    </div>
  </main>

  <footer>
    © 2026 PROFIT — Advertising &amp; Marketing
  </footer>
</body>
</html>
